<!doctype html>
<html lang="pt-BR" data-theme="solido-claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arco · A Sala dos Buscadores</title>
<link rel="stylesheet" href="../tokens.css?v=575303c42586">
<link rel="stylesheet" href="../components/bundle.css?v=93b3f28e0b3b">
<link rel="stylesheet" href="../assets/themes.css?v=e62c6481f72a">




<link rel="stylesheet" href="../components/refinement.css?v=ea7394631f17">

<script>try { var t = new URLSearchParams(location.search).get("tema"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<script src="../components/bundle.js?v=0184409eeff8"></script>
</head>
<body>
<div class="sdb-stage">
  <div class="sdb-grid" style="--sdb-col:140px;gap:16px">
    <figure class="sdb-spec" style="margin:0"><div class="sdb-tile" style="background:#111313"><span data-arc data-on="grafite" class="" style="width:60px;height:80px"></span></div><figcaption class="sdb-caption">Branco · grafite</figcaption></figure>
    <figure class="sdb-spec" style="margin:0"><div class="sdb-tile" style="background:#F6E7CE;box-shadow:inset 0 0 0 1px rgba(17,19,19,.08)"><span data-arc data-on="bege" class="" style="width:60px;height:80px"></span></div><figcaption class="sdb-caption">Bordô · bege</figcaption></figure>
    <figure class="sdb-spec" style="margin:0"><div class="sdb-tile" style="background:#390007"><span data-arc data-on="bordo" class="" style="width:60px;height:80px"></span></div><figcaption class="sdb-caption">Bege · bordô</figcaption></figure>
    <figure class="sdb-spec" style="margin:0"><div class="sdb-tile" style="background:linear-gradient(155deg,#E6DD84,#D3C759 45%,#B9AD45)"><span data-arc data-on="ouro" class="" style="width:60px;height:80px"></span></div><figcaption class="sdb-caption">Preto · ouro</figcaption></figure>
    <figure class="sdb-spec" style="margin:0"><div class="sdb-tile sdb-plate--grafite"><span data-arc="line" data-on="grafite" class="" style="width:60px;height:80px"></span></div><figcaption class="sdb-caption">Traço fino</figcaption></figure>
  </div>
  <div class="sdb-row" style="gap:24px;align-items:flex-end">
    <span data-arc class="" style="width:12px;height:16px"></span><span data-arc class="" style="width:18px;height:24px"></span><span data-arc class="" style="width:27px;height:36px"></span><span data-arc class="" style="width:36px;height:48px"></span>
    <span class="sdb-emblem" aria-hidden="true"><span data-arc data-on="ouro" class="" style=""></span></span>
    <span class="sdb-neutral__icon" aria-hidden="true" style="display:inline-grid"><span data-arc data-on="bordo" class="" style=""></span></span>
    <span class="sdb-hint" style="flex-basis:100%">Mínimos: 12 × 16 px em linha de texto · 18 × 24 px como ícone · 36 × 48 px como marca. Em discos e emblemas, 38% da altura do contêiner.</span>
  </div>
</div>
<script>SalaBuscadores.hydrate();</script>
<script src="../components/refined.js?v=98df67e3bc61" defer></script>
<script>
window.addEventListener('message',function(e){if(e.source!==parent)return;if(['solido-claro','solido-escuro','vidro-claro','vidro-escuro'].includes(e.data?.sdbTheme))document.documentElement.dataset.theme=e.data.sdbTheme;});
try {new ResizeObserver(function(){parent.postMessage({sdbAltura:Math.ceil(document.body.getBoundingClientRect().height)},'*');}).observe(document.body);}catch{}
</script>
</body>
</html>
