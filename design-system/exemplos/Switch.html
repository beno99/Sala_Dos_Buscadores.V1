<!doctype html>
<html lang="pt-BR" data-theme="solido-claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switch · A Sala dos Buscadores</title>
<link rel="stylesheet" href="../tokens.css?v=59ab3ed333f6">
<link rel="stylesheet" href="../components/bundle.css?v=b6fa2c922c99">
<link rel="stylesheet" href="../assets/themes.css?v=e62c6481f72a">




<link rel="stylesheet" href="../components/refinement.css?v=ea7394631f17">


<script>try { var t = new URLSearchParams(location.search).get("tema"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<script src="../components/bundle.js?v=a05973182158"></script>
</head>
<body>
<div class="sdb-stage">
  <div class="sdb-list" style="max-width:560px">
    <label class="sdb-option"><span>Mostrar texto original ao lado da tradução</span><span class="sdb-switch"><input type="checkbox" role="switch" checked></span></label>
    <label class="sdb-option"><span>Incluir sínteses geradas por IA</span><span class="sdb-switch"><input type="checkbox" role="switch"></span></label>
    <label class="sdb-option"><span>Sincronizar com o aplicativo <small class="sdb-footnote" style="display:block">Indisponível nesta versão</small></span><span class="sdb-switch"><input type="checkbox" role="switch" disabled></span></label>
    <label class="sdb-option"><span>Citar fontes em toda resposta <small class="sdb-footnote" style="display:block">Sempre ligado</small></span><span class="sdb-switch"><input type="checkbox" role="switch" checked disabled></span></label>
  </div>
</div>
<script>SalaBuscadores.hydrate();</script>
<script src="../components/refined.js?v=98df67e3bc61" defer></script>
<script>
window.addEventListener('message',function(e){if(e.source!==parent)return;if(['solido-claro','solido-escuro','vidro-claro','vidro-escuro'].includes(e.data?.sdbTheme))document.documentElement.dataset.theme=e.data.sdbTheme;});
try {new ResizeObserver(function(){parent.postMessage({sdbAltura:Math.ceil(document.body.getBoundingClientRect().height)},'*');}).observe(document.body);}catch{}
</script>
</body>
</html>
