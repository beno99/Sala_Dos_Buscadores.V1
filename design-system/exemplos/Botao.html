<!doctype html>
<html lang="pt-BR" data-theme="solido-claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Botao · A Sala dos Buscadores</title>
<link rel="stylesheet" href="../tokens.css?v=59ab3ed333f6">
<link rel="stylesheet" href="../components/bundle.css?v=b6fa2c922c99">
<link rel="stylesheet" href="../assets/themes.css?v=e62c6481f72a">




<link rel="stylesheet" href="../components/refinement.css?v=ea7394631f17">


<script>try { var t = new URLSearchParams(location.search).get("tema"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<script src="../components/bundle.js?v=a05973182158"></script>
</head>
<body>
<div class="sdb-stage">
  <div class="sdb-spec"><span class="sdb-caption">Variantes</span>
    <div class="sdb-row">
      <button class="sdb-btn sdb-btn--primary" type="button">Entrar na Sala</button>
      <button class="sdb-btn sdb-btn--secondary" type="button">Comparar tradições</button>
      <button class="sdb-btn sdb-btn--glass" type="button">Ver fontes</button>
      <button class="sdb-btn sdb-btn--gold" type="button">Começar</button>
      <button class="sdb-btn sdb-btn--warm" type="button">Pular e ir ao Portal</button>
      <button class="sdb-btn sdb-btn--tinted" type="button"><span data-icon="estante" class=""></span>Salvar na estante</button>
      <button class="sdb-btn sdb-btn--plain" type="button">Ver todas</button>
      <button class="sdb-btn sdb-btn--destructive" type="button"><span data-icon="lixeira" class=""></span>Remover</button>
    </div></div>
  <div class="sdb-spec"><span class="sdb-caption">Foco dourado · cantos de 12 px</span>
    <div class="sdb-row">
      <button class="sdb-btn sdb-btn--primary is-focus" type="button">Salvar</button>
      <button class="sdb-btn sdb-btn--secondary is-focus" type="button">Cancelar</button>
      <button class="sdb-btn sdb-btn--glass is-focus" type="button">Ver fontes</button>
      <button class="sdb-btn sdb-btn--icon sdb-btn--secondary is-focus" type="button" aria-label="Salvar na estante"><span data-icon="estante"></span></button>
    </div>
    <span class="sdb-caption">Use Tab para conferir o mesmo contorno nas demais ações.</span>
  </div>
  <div class="sdb-spec"><span class="sdb-caption">Com ícone</span>
    <div class="sdb-row">
      <button class="sdb-btn sdb-btn--icon" type="button" aria-label="Copiar citação" data-tip="Copiar citação"><span data-icon="copiar" class=""></span></button>
      <button class="sdb-btn sdb-btn--icon sdb-btn--secondary" type="button" aria-label="Compartilhar" data-tip="Compartilhar"><span data-icon="compartilhar" class=""></span></button>
      <button class="sdb-btn sdb-btn--icon sdb-btn--primary" type="button" aria-label="Nova comparação" data-tip="Nova comparação"><span data-icon="mais" class=""></span></button>
      <button class="sdb-btn sdb-btn--glass" type="button"><span data-icon="busca" class=""></span>Buscar no acervo</button>
      <div class="sdb-plate sdb-plate--bordo sdb-media" style="margin:0;aspect-ratio:auto;min-height:0;padding:8px;border-radius:999px;display:inline-flex">
        <button class="sdb-btn sdb-glass--clear sdb-btn--sm" type="button"><span data-icon="play" class="sdb-icon--sm"></span>Assistir</button>
        <button class="sdb-btn sdb-btn--icon sdb-btn--sm sdb-glass--clear" type="button" aria-label="Salvar"><span data-icon="estante" class="sdb-icon--sm"></span></button>
      </div>
    </div></div>
  <div class="sdb-spec"><span class="sdb-caption">Compartilhar · "Copiar link"; vira "Compartilhar" onde houver menu do sistema</span>
    <div class="sdb-row">
      <button class="sdb-btn sdb-btn--secondary sdb-btn--sm sdb-share" type="button" data-share data-share-title="Os sete princípios, em linguagem simples"><span class="sdb-share__copy"><span data-icon="copiar" class="sdb-icon--sm"></span>Copiar link</span><span class="sdb-share__native"><span data-icon="compartilhar" class="sdb-icon--sm"></span>Compartilhar</span></button>
      <button class="sdb-btn sdb-btn--secondary sdb-btn--sm sdb-share is-native" type="button" tabindex="-1" aria-hidden="true"><span class="sdb-share__copy"><span data-icon="copiar" class="sdb-icon--sm"></span>Copiar link</span><span class="sdb-share__native"><span data-icon="compartilhar" class="sdb-icon--sm"></span>Compartilhar</span></button>
      <button class="sdb-btn sdb-btn--plain sdb-btn--sm" type="button" onclick="SalaBuscadores.toast('Selecione o link e copie.', {title: 'Não foi possível copiar', select: location.href, duration: 9000})">Ver o toast sem área de transferência</button>
    </div></div>
  <div class="sdb-spec"><span class="sdb-caption">Estados · primário</span>
    <div class="sdb-row">
      <button class="sdb-btn sdb-btn--primary" type="button">Padrão</button>
      <button class="sdb-btn sdb-btn--primary is-hover" type="button">Hover</button>
      <button class="sdb-btn sdb-btn--primary is-pressed" type="button">Pressionado</button>
      <button class="sdb-btn sdb-btn--primary is-focus" type="button">Foco</button>
      <button class="sdb-btn sdb-btn--primary" type="button" disabled>Desabilitado</button>
      <button class="sdb-btn sdb-btn--primary is-loading" type="button" aria-busy="true"><span>Consultando</span><span class="sdb-spinner" aria-hidden="true"></span></button>
      <button id="load-demo" class="sdb-btn sdb-btn--secondary" type="button"><span>Clique para carregar</span><span class="sdb-spinner" aria-hidden="true"></span></button>
    </div></div>
  <div class="sdb-spec"><span class="sdb-caption">Estados · secundário, vidro, destrutivo</span>
    <div class="sdb-row">
      <button class="sdb-btn sdb-btn--secondary is-hover" type="button">Hover</button>
      <button class="sdb-btn sdb-btn--glass is-pressed" type="button">Pressionado</button>
      <button class="sdb-btn sdb-btn--glass" type="button" disabled>Desabilitado</button>
      <button class="sdb-btn sdb-btn--destructive is-hover" type="button">Hover</button>
      <button class="sdb-btn sdb-btn--destructive" type="button" disabled>Desabilitado</button>
    </div></div>
  <div class="sdb-spec"><span class="sdb-caption">Tamanhos · 34 · 44 · 54 · bloco</span>
    <div class="sdb-row">
      <button class="sdb-btn sdb-btn--primary sdb-btn--sm" type="button">Pequeno</button>
      <button class="sdb-btn sdb-btn--primary" type="button">Médio</button>
      <button class="sdb-btn sdb-btn--primary sdb-btn--lg" type="button">Grande</button>
    </div>
    <div style="max-width:420px"><button class="sdb-btn sdb-btn--primary sdb-btn--lg sdb-btn--block" type="button">Continuar degrau III</button></div>
  </div>
</div>
<script>SalaBuscadores.hydrate();
document.getElementById("load-demo").addEventListener("click", function () {
  var b = this; if (b.classList.contains("is-loading")) return;
  b.classList.add("is-loading"); b.setAttribute("aria-busy", "true");
  setTimeout(function () { b.classList.remove("is-loading"); b.removeAttribute("aria-busy"); SalaBuscadores.toast("Acervo atualizado."); }, 1400);
});
</script>
<script src="../components/refined.js?v=98df67e3bc61" defer></script>
<script>
window.addEventListener('message',function(e){if(e.source!==parent)return;if(['solido-claro','solido-escuro','vidro-claro','vidro-escuro'].includes(e.data?.sdbTheme))document.documentElement.dataset.theme=e.data.sdbTheme;});
try {new ResizeObserver(function(){parent.postMessage({sdbAltura:Math.ceil(document.body.getBoundingClientRect().height)},'*');}).observe(document.body);}catch{}
</script>
</body>
</html>
