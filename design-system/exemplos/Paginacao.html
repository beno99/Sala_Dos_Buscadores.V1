<!doctype html>
<html lang="pt-BR" data-theme="solido-claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paginacao · A Sala dos Buscadores</title>
<link rel="stylesheet" href="../tokens.css?v=59ab3ed333f6">
<link rel="stylesheet" href="../components/bundle.css?v=9d29887cc763">
<link rel="stylesheet" href="../assets/themes.css?v=e62c6481f72a">




<link rel="stylesheet" href="../components/refinement.css?v=ea7394631f17">


<script>try { var t = new URLSearchParams(location.search).get("tema"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<script src="../components/bundle.js?v=a05973182158"></script>
</head>
<body>
<div class="sdb-stage">
  <nav class="sdb-pages" aria-label="Paginação dos resultados">
    <button class="sdb-page sdb-page--nav" aria-label="Página anterior"><span data-icon="chevronEsquerda" class="sdb-icon--sm"></span><span>Anterior</span></button>
    <button class="sdb-page">1</button><span class="sdb-pages__gap">…</span><button class="sdb-page">4</button><button class="sdb-page" aria-current="page">5</button><button class="sdb-page">6</button><span class="sdb-pages__gap">…</span><button class="sdb-page">12</button>
    <span class="sdb-pages__compact">Página 5 de 12</span>
    <button class="sdb-page sdb-page--nav" aria-label="Próxima página"><span>Próxima</span><span data-icon="chevronDireita" class="sdb-icon--sm"></span></button>
  </nav>
  <div class="sdb-row" style="gap:16px"><div class="sdb-dots" role="tablist" aria-label="Destaques" id="dots"><button aria-current="true" aria-label="Destaque 1"></button><button aria-label="Destaque 2"></button><button aria-label="Destaque 3"></button><button aria-label="Destaque 4"></button></div><span class="sdb-hint">Pontos para carrosséis de destaques.</span></div>
</div>
<script>SalaBuscadores.hydrate();
var d = document.getElementById("dots");
d.addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; Array.prototype.forEach.call(d.children, function (x) { x.removeAttribute("aria-current"); }); b.setAttribute("aria-current", "true"); });
</script>
<script src="../components/refined.js?v=98df67e3bc61" defer></script>
<script>
window.addEventListener('message',function(e){if(e.source!==parent)return;if(['solido-claro','solido-escuro','vidro-claro','vidro-escuro'].includes(e.data?.sdbTheme))document.documentElement.dataset.theme=e.data.sdbTheme;});
try {new ResizeObserver(function(){parent.postMessage({sdbAltura:Math.ceil(document.body.getBoundingClientRect().height)},'*');}).observe(document.body);}catch{}
</script>
</body>
</html>
