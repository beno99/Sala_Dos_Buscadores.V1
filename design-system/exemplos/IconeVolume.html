<!doctype html>
<html lang="pt-BR" data-theme="solido-claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IconeVolume · A Sala dos Buscadores</title>
<link rel="stylesheet" href="../tokens.css?v=59ab3ed333f6">
<link rel="stylesheet" href="../components/bundle.css?v=9d29887cc763">
<link rel="stylesheet" href="../assets/themes.css?v=e62c6481f72a">




<link rel="stylesheet" href="../components/refinement.css?v=ea7394631f17">

<link rel="stylesheet" href="../components/EstadosInterface/estados-interface.css?v=d204d9afc5dc">
<script src="../components/EstadosInterface/estados-interface.js?v=8cc36cc22b11"></script>
<script>try { var t = new URLSearchParams(location.search).get("tema"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<script src="../components/bundle.js?v=a05973182158"></script>
</head>
<body>
<div class="sdb-stage">
  <section class="sdb-ui-demo" aria-labelledby="volume-title">
    <h2 id="volume-title" class="sdb-title-2">Ícones que orientam</h2>
    <p class="sdb-footnote">Volume reservado para estados vazios, avisos e diálogos. Navegação e busca usam traço simples.</p>
    <div class="sdb-ui-demo-icons">
      <figure><span data-ui-volume="pasta"></span><figcaption>Biblioteca vazia</figcaption></figure>
      <figure><span data-ui-volume="historico"></span><figcaption>Sem atividade</figcaption></figure>
      <figure><span data-ui-volume="busca"></span><figcaption>Sem resultados</figcaption></figure>
      <figure><span data-ui-volume="livro"></span><figcaption>Leitura</figcaption></figure>
      <figure><span data-ui-volume="alerta"></span><figcaption>Atenção</figcaption></figure>
      <figure><span data-ui-volume="sucesso"></span><figcaption>Concluído</figcaption></figure>
      <figure><span data-ui-volume="escudo"></span><figcaption>Orientação</figcaption></figure>
    </div>
    <div class="sdb-ui-demo-icons"><span class="sdb-footnote">Tamanho compacto</span><span data-ui-volume="pasta" data-ui-size="small"></span><span data-ui-volume="livro" data-ui-size="small"></span><span data-ui-volume="escudo" data-ui-size="small"></span></div>
  </section>
</div>
<script src="../components/refined.js?v=98df67e3bc61" defer></script>
<script>
window.addEventListener('message',function(e){if(e.source!==parent)return;if(['solido-claro','solido-escuro','vidro-claro','vidro-escuro'].includes(e.data?.sdbTheme))document.documentElement.dataset.theme=e.data.sdbTheme;});
try {new ResizeObserver(function(){parent.postMessage({sdbAltura:Math.ceil(document.body.getBoundingClientRect().height)},'*');}).observe(document.body);}catch{}
</script>
</body>
</html>
