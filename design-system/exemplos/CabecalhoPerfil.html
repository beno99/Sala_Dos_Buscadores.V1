<div class="sdb-stage" style="gap:32px">

      <div class="sdb-profilehead__info">
        <div class="sdb-profilehead__tags"><span class="sdb-badge sdb-badge--ink">Buscador</span><span class="sdb-badge sdb-badge--neutral">Privado · só você vê esta página</span></div>

window.addEventListener('message',function(e){if(e.source!==parent)return;if(['solido-claro','solido-escuro','vidro-claro','vidro-escuro'].includes(e.data?.sdbTheme))document.documentElement.dataset.theme=e.data.sdbTheme;});
