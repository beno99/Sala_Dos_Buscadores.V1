<!doctype html>
<html lang="pt-BR" data-theme="solido-claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeletorTema · A Sala dos Buscadores</title>
<link rel="stylesheet" href="../tokens.css?v=cfbebf7e5dcc">
<link rel="stylesheet" href="../components/bundle.css?v=87ea5c78d6a7">
<link rel="stylesheet" href="../assets/themes.css?v=e62c6481f72a">



<link rel="stylesheet" href="../components/refinement.css?v=ea7394631f17">

<script>try { var t = new URLSearchParams(location.search).get("tema"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<script src="../components/bundle.js?v=0184409eeff8"></script>
</head>
<body>
<div class="sdb-stage" style="gap:24px">
  <div class="sdb-modal sdb-modal--static" style="width:min(720px,100%);max-height:none;padding:32px" role="dialog" aria-labelledby="ap-titulo">
    <h2 id="ap-titulo" class="sdb-title-2" style="margin:0 0 24px">Aparência</h2>
    <p class="sdb-headline" style="margin:0">Tema</p>
    <p class="sdb-footnote" style="margin:4px 0 16px">Escolha as cores da interface</p>
    <div class="sdb-themepick" role="radiogroup" aria-label="Tema">
      <button class="sdb-themepick__opt" type="button" role="radio" aria-checked="true"><span class="sdb-themepick__mini" data-theme="solido-claro"><i></i></span>Areia</button>
      <button class="sdb-themepick__opt" type="button" role="radio" aria-checked="false" tabindex="-1"><span class="sdb-themepick__mini" data-theme="solido-escuro"><i></i></span>Escuro</button>
      <button class="sdb-themepick__opt" type="button" role="radio" aria-checked="false" tabindex="-1"><span class="sdb-themepick__mini" data-theme="vidro-claro"><i></i></span>Vidro claro</button>
      <button class="sdb-themepick__opt" type="button" role="radio" aria-checked="false" tabindex="-1"><span class="sdb-themepick__mini" data-theme="vidro-escuro"><i></i></span>Vidro escuro</button>
    </div>
    <label class="sdb-switch" style="margin-top:32px;width:100%;justify-content:space-between"><span><b>Barra lateral</b><br><span class="sdb-footnote">Deixar a barra lateral translúcida</span></span><input type="checkbox" role="switch"></label>
    <div class="sdb-modal__actions" style="margin-top:24px"><button class="sdb-btn sdb-btn--secondary" type="button">Cancelar</button><button class="sdb-btn sdb-btn--primary" type="button">Salvar</button></div>
  </div>
</div>
<script>SalaBuscadores.hydrate();</script>
<script src="../components/refined.js?v=98df67e3bc61" defer></script>
<script>
window.addEventListener('message',function(e){if(e.source!==parent)return;if(['solido-claro','solido-escuro','vidro-claro','vidro-escuro'].includes(e.data?.sdbTheme))document.documentElement.dataset.theme=e.data.sdbTheme;});
try {new ResizeObserver(function(){parent.postMessage({sdbAltura:Math.ceil(document.body.getBoundingClientRect().height)},'*');}).observe(document.body);}catch{}
</script>
</body>
</html>
