<!doctype html>
<html lang="pt-BR" data-theme="solido-claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proporcao · A Sala dos Buscadores</title>
<link rel="stylesheet" href="../tokens.css?v=59ab3ed333f6">
<link rel="stylesheet" href="../components/bundle.css?v=b6fa2c922c99">
<link rel="stylesheet" href="../assets/themes.css?v=e62c6481f72a">




<link rel="stylesheet" href="../components/refinement.css?v=ea7394631f17">


<script>try { var t = new URLSearchParams(location.search).get("tema"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<script src="../components/bundle.js?v=a05973182158"></script>
</head>
<body>
<div class="sdb-stage">
  <div class="sdb-spec"><span class="sdb-caption">Proporção por tela</span>
    <div style="display:flex;height:84px;gap:8px">
      <div style="flex:60;border-radius:24px;background:var(--bg-canvas);box-shadow:inset 0 0 0 1px var(--separator);display:flex;align-items:flex-end;padding:16px 16px" class="sdb-headline">60% canvas</div>
      <div style="flex:25;border-radius:24px;background:#390007;color:#F6E7CE;display:flex;align-items:flex-end;padding:16px 16px" class="sdb-headline">25% bordô</div>
      <div style="flex:10;border-radius:24px;background:var(--prominent-fill);color:var(--on-prominent);display:flex;align-items:flex-end;padding:16px 8px" class="sdb-headline">10%</div>
      <div style="flex:5;border-radius:24px;background:linear-gradient(155deg,#E6DD84,#D3C759 45%,#B9AD45)"></div>
    </div></div>
  <div class="sdb-grid" style="--sdb-col:190px;gap:16px">
    <div style="background:#F6E7CE;color:#111313;padding:16px;border-radius:24px;box-shadow:inset 0 0 0 1px rgba(17,19,19,.08)"><div class="sdb-title-2">Grafite sobre bege</div><div class="sdb-footnote" style="color:rgba(17,19,19,.7);margin-top:8px">Leitura no tema claro</div></div>
    <div style="background:#F6E7CE;color:#390007;padding:16px;border-radius:24px;box-shadow:inset 0 0 0 1px rgba(17,19,19,.08)"><div class="sdb-title-2">Bordô sobre bege</div><div class="sdb-footnote" style="color:#390007;opacity:.8;margin-top:8px">Destaque e links</div></div>
    <div style="background:#111313;color:#FFFFFF;padding:16px;border-radius:24px"><div class="sdb-title-2">Branco sobre grafite</div><div class="sdb-footnote" style="color:rgba(255,255,255,.7);margin-top:8px">Leitura no tema escuro</div></div>
    <div style="background:#390007;color:#F6E7CE;padding:16px;border-radius:24px"><div class="sdb-title-2">Bege sobre bordô</div><div class="sdb-footnote" style="color:#F6E7CE;opacity:.8;margin-top:8px">Selos, faixas, destrutivo</div></div>
  </div>
  <div class="sdb-row" style="gap:8px">
    <span class="sdb-badge sdb-badge--neutral"><span data-icon="check" class="sdb-icon--sm"></span>Ouro como emblema com glifo preto</span>
    <span class="sdb-badge sdb-badge--neutral"><span data-icon="fechar" class="sdb-icon--sm"></span>Ouro como texto ou fundo de leitura</span>
  </div>
</div>
<script>SalaBuscadores.hydrate();</script>
<script src="../components/refined.js?v=98df67e3bc61" defer></script>
<script>
window.addEventListener('message',function(e){if(e.source!==parent)return;if(['solido-claro','solido-escuro','vidro-claro','vidro-escuro'].includes(e.data?.sdbTheme))document.documentElement.dataset.theme=e.data.sdbTheme;});
try {new ResizeObserver(function(){parent.postMessage({sdbAltura:Math.ceil(document.body.getBoundingClientRect().height)},'*');}).observe(document.body);}catch{}
</script>
</body>
</html>
