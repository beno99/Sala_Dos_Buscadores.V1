<!doctype html>
<html lang="pt-BR" data-theme="solido-claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toast · A Sala dos Buscadores</title>
<link rel="stylesheet" href="../tokens.css?v=ef23aedf2e12">
<link rel="stylesheet" href="../components/bundle.css?v=8852b0631680">
<link rel="stylesheet" href="../assets/themes.css?v=8c2c029eb81b">


<link rel="stylesheet" href="../components/refinement.css?v=ea7394631f17">
<script>try { var t = new URLSearchParams(location.search).get("tema"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<script src="../components/bundle.js?v=27bc36d6d26a"></script>
</head>
<body>
<div class="sdb-stage">
  <div class="sdb-row">
    <button class="sdb-btn sdb-btn--glass" data-toast="Citação copiada no formato ABNT.">Confirmação</button>
    <button class="sdb-btn sdb-btn--glass" data-toast="Trecho removido da estante." data-toast-action="Desfazer" data-toast-icon="lixeira">Com ação</button>
    <button class="sdb-btn sdb-btn--glass" data-toast="Verifique a conexão e tente de novo." data-toast-title="Erro: a consulta não terminou" data-toast-variant="erro">Erro</button>
  </div>
  <div class="sdb-spec" style="align-items:flex-start"><span class="sdb-caption">Estático</span>
    <div class="sdb-toast sdb-toast--static"><span class="sdb-toast__icon"><span data-icon="check" class=""></span></span><div class="sdb-toast__msg">Trilha salva na estante</div><button class="sdb-btn sdb-btn--tinted sdb-btn--sm">Abrir</button><button class="sdb-toast__close" aria-label="Fechar"><span data-icon="fechar" class="sdb-icon--sm"></span></button></div>
    <div class="sdb-toast sdb-toast--static sdb-toast--error"><span class="sdb-toast__icon"><span data-icon="erro" class=""></span></span><div class="sdb-toast__msg"><strong>Erro: não foi possível copiar</strong><span class="sdb-secondary">Selecione o texto e copie manualmente.</span></div><button class="sdb-toast__close" aria-label="Fechar"><span data-icon="fechar" class="sdb-icon--sm"></span></button></div>
  </div>
</div>
<script>SalaBuscadores.hydrate();</script>
<script src="../components/refined.js?v=98df67e3bc61" defer></script>
<script>
window.addEventListener('message',function(e){if(e.source!==parent)return;if(['solido-claro','solido-escuro','vidro-claro','vidro-escuro'].includes(e.data?.sdbTheme))document.documentElement.dataset.theme=e.data.sdbTheme;});
try {new ResizeObserver(function(){parent.postMessage({sdbAltura:Math.ceil(document.body.getBoundingClientRect().height)},'*');}).observe(document.body);}catch{}
</script>
</body>
</html>
