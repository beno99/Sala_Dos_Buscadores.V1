<!doctype html>
<html lang="pt-BR" data-theme="solido-claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio · A Sala dos Buscadores</title>
<link rel="stylesheet" href="../tokens.css?v=ef23aedf2e12">

<link rel="stylesheet" href="../assets/themes.css?v=8c2c029eb81b">


<link rel="stylesheet" href="../components/refinement.css?v=ea7394631f17">
<script>try { var t = new URLSearchParams(location.search).get("tema"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<script src="../components/bundle.js?v=27bc36d6d26a"></script>
</head>
<body>
<div class="sdb-stage">
  <div class="sdb-material sdb-panel" style="max-width:480px"><fieldset class="sdb-fieldset"><legend class="sdb-caption">Nível de aprofundamento</legend>
    <label class="sdb-check"><input type="radio" name="nivel"> <span>Iniciante <small>Contexto histórico e vocabulário básico</small></span></label>
    <label class="sdb-check"><input type="radio" name="nivel" checked> <span>Intermediário <small>Leitura comentada das fontes</small></span></label>
    <label class="sdb-check"><input type="radio" name="nivel"> <span>Avançado <small>Crítica textual e línguas originais</small></span></label>
    <label class="sdb-check"><input type="radio" name="nivel" disabled> <span>Pesquisa (fechado)</span></label>
  </fieldset></div>
</div>
<script>SalaBuscadores.hydrate();</script>
<script src="../components/refined.js?v=98df67e3bc61" defer></script>
<script>
window.addEventListener('message',function(e){if(e.source!==parent)return;if(['solido-claro','solido-escuro','vidro-claro','vidro-escuro'].includes(e.data?.sdbTheme))document.documentElement.dataset.theme=e.data.sdbTheme;});
try {new ResizeObserver(function(){parent.postMessage({sdbAltura:Math.ceil(document.body.getBoundingClientRect().height)},'*');}).observe(document.body);}catch{}
</script>
</body>
</html>
