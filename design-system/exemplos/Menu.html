<!doctype html>
<html lang="pt-BR" data-theme="solido-claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu · A Sala dos Buscadores</title>
<link rel="stylesheet" href="../tokens.css?v=59ab3ed333f6">
<link rel="stylesheet" href="../components/bundle.css?v=b6fa2c922c99">
<link rel="stylesheet" href="../assets/themes.css?v=e62c6481f72a">




<link rel="stylesheet" href="../components/refinement.css?v=ea7394631f17">


<script>try { var t = new URLSearchParams(location.search).get("tema"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<script src="../components/bundle.js?v=a05973182158"></script>
</head>
<body>
<div class="sdb-stage">
  <div class="sdb-row sdb-row--top" style="gap:32px">
    <div class="sdb-menu-wrap">
      <button class="sdb-btn sdb-btn--glass" type="button" data-menu-trigger aria-haspopup="menu" aria-expanded="false">Ações do trecho<span data-icon="chevronBaixo" class="sdb-icon--sm"></span></button>
      <div class="sdb-menu" role="menu">
        <button class="sdb-menu__item" role="menuitem" data-toast="Citação copiada no formato ABNT."><span>Copiar citação</span><span class="sdb-kbd">⌘C</span><span data-icon="copiar" class=""></span></button>
        <button class="sdb-menu__item" role="menuitem" data-toast="Trecho salvo na estante."><span>Salvar na estante</span><span data-icon="estante" class=""></span></button>
        <button class="sdb-menu__item" role="menuitem" data-toast="Abrindo a grade comparativa."><span>Comparar com outras Salas</span><span data-icon="comparar" class=""></span></button>
        <div class="sdb-menu__sep"></div>
        <button class="sdb-menu__item sdb-menu__item--danger" role="menuitem" data-toast="Trecho removido." data-toast-action="Desfazer"><span>Remover da estante</span><span data-icon="lixeira" class=""></span></button>
      </div>
    </div>
    <div class="sdb-spec"><span class="sdb-caption">Aberto</span>
      <div class="sdb-menu sdb-menu--static" role="menu" aria-label="Exibição">
        <div class="sdb-menu__label">Exibição</div>
        <button class="sdb-menu__item" role="menuitemcheckbox" aria-checked="true"><span>Texto original</span></button>
        <button class="sdb-menu__item is-active" role="menuitemcheckbox" aria-checked="true"><span>Tradução</span></button>
        <button class="sdb-menu__item" role="menuitemcheckbox" aria-checked="false"><span>Notas de rodapé</span></button>
        <div class="sdb-menu__sep"></div>
        <button class="sdb-menu__item" role="menuitem" disabled><span>Ouvir trecho (em breve)</span><span data-icon="audio" class=""></span></button>
      </div>
    </div>
  </div>
</div>
<script>SalaBuscadores.hydrate();</script>
<script src="../components/refined.js?v=98df67e3bc61" defer></script>
<script>
window.addEventListener('message',function(e){if(e.source!==parent)return;if(['solido-claro','solido-escuro','vidro-claro','vidro-escuro'].includes(e.data?.sdbTheme))document.documentElement.dataset.theme=e.data.sdbTheme;});
try {new ResizeObserver(function(){parent.postMessage({sdbAltura:Math.ceil(document.body.getBoundingClientRect().height)},'*');}).observe(document.body);}catch{}
</script>
</body>
</html>
