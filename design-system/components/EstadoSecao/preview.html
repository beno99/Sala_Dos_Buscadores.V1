<!-- @dsCard group="Componentes básicos" height=530 subtitle="Container padrão; mensagem e ação conforme o contexto" -->
<div class="sdb-stage">
  <div class="sdb-ui-demo">
    <div class="sdb-ui-demo-tabs" role="group" aria-label="Exemplo de estado">
      <button type="button" class="sdb-ui-secondary" data-state="atividade" aria-pressed="true">Sem atividade</button>
      <button type="button" class="sdb-ui-secondary" data-state="salvos" aria-pressed="false">Biblioteca vazia</button>
      <button type="button" class="sdb-ui-secondary" data-state="busca" aria-pressed="false">Sem resultados</button>
      <button type="button" class="sdb-ui-secondary" data-state="erro" aria-pressed="false">Falha ao carregar</button>
    </div>
    <section class="sdb-ui-empty" aria-labelledby="empty-title">
      <span id="empty-icon" data-ui-volume="historico"></span>
      <h3 id="empty-title">Sua jornada começa com uma descoberta</h3>
      <p id="empty-description">Nenhuma atividade por aqui ainda. Explore uma sala e encontre um tema que desperte sua curiosidade.</p>
      <button type="button" id="empty-action" class="sdb-ui-primary"><span>Explorar salas</span><span data-ui-icon="seta"></span></button>
    </section>
    <p id="empty-feedback" class="sdb-hint" role="status"></p>
  </div>
</div>
<script>
(() => {
  const states = {
    atividade: ["historico", "Sua jornada começa com uma descoberta", "Nenhuma atividade por aqui ainda. Explore uma sala e encontre um tema que desperte sua curiosidade.", "Explorar salas"],
    salvos: ["pasta", "Um lugar para suas próximas leituras", "Você ainda não salvou conteúdos. Guarde o que fizer sentido para continuar a explorar depois.", "Encontrar conteúdos"],
    busca: ["busca", "Ainda não encontramos esse caminho", "Nenhum resultado para esta busca. Experimente outra palavra ou volte a explorar todas as salas.", "Limpar busca"],
    erro: ["alerta", "Erro: não foi possível abrir esta sala", "O conteúdo não carregou desta vez. Tente novamente para continuar sua leitura.", "Tentar novamente"],
  };
  document.querySelectorAll("[data-state]").forEach(button => button.addEventListener("click", () => {
    const [icon, title, description, action] = states[button.dataset.state];
    document.querySelectorAll("[data-state]").forEach(item => item.setAttribute("aria-pressed", String(item === button)));
    document.getElementById("empty-icon").innerHTML = SalaInterface.volume(icon);
    document.getElementById("empty-title").textContent = title;
    document.getElementById("empty-description").textContent = description;
    document.querySelector("#empty-action span").textContent = action;
    document.getElementById("empty-feedback").textContent = "";
  }));
  document.getElementById("empty-action").addEventListener("click", () => {
    document.getElementById("empty-feedback").textContent = "Ação de exemplo: " + document.querySelector("#empty-action span").textContent + ". Na aplicação, conecte ao destino correspondente.";
  });
})();
</script>
