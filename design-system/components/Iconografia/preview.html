<!-- @dsCard group="Fundamentos" height=400 subtitle="Traço 1,7, cantos arredondados, neutros" -->
<div class="sdb-stage">
  <div id="icon-grid" class="sdb-material sdb-grid" style="--sdb-col:104px;gap:0;padding:8px;border-radius:24px"></div>
  <p class="sdb-hint">Grade 24 px, traço 1,7 px, pontas e junções arredondadas. Sem cristais, mandalas, lua, velas, fumaça ou símbolos religiosos.</p>
</div>
<script>SalaBuscadores.hydrate();
var g = document.getElementById("icon-grid");
SalaBuscadores.icons.forEach(function (n) {
  var c = document.createElement("div");
  c.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:16px";
  c.innerHTML = SalaBuscadores.icon(n, "sdb-icon--lg") + '<span style="font-size:11px;color:var(--label-secondary)">' + n + "</span>";
  g.appendChild(c);
});
</script>
