<!-- @dsCard group="Curadoria" height=520 subtitle="Um parágrafo por bloco, com termo e obra" -->
<div class="sdb-stage">
  <div class="sdb-editor" style="max-width:760px">
    <div class="sdb-editor__block">
      <span class="sdb-editor__num" aria-hidden="true">1</span>
      <div class="sdb-editor__main">
        <div class="sdb-editor__bar" role="toolbar" aria-label="Marcações do parágrafo 1">
          <button class="sdb-btn sdb-btn--secondary sdb-btn--sm" type="button"><dfn>Termo</dfn></button>
          <button class="sdb-btn sdb-btn--secondary sdb-btn--sm" type="button"><cite>Obra</cite></button>
          <span class="sdb-footnote">Selecione o trecho e escolha a marcação.</span>
        </div>
        <div class="sdb-control sdb-control--area"><textarea aria-label="Parágrafo 1" rows="3">No _Poimandres_, a alma sobe pelas sete esferas até a *Ogdóade*.</textarea></div>
        <p class="sdb-editor__preview">No <cite>Poimandres</cite>, a alma sobe pelas sete esferas até a <dfn>Ogdóade</dfn>.</p>
      </div>
      <div class="sdb-editor__tools">
        <button class="sdb-btn sdb-btn--icon sdb-btn--sm" type="button" aria-label="Subir parágrafo 1" disabled><span data-icon="chevronBaixo" class="sdb-icon--sm sdb-editor__up"></span></button>
        <button class="sdb-btn sdb-btn--icon sdb-btn--sm" type="button" aria-label="Descer parágrafo 1" data-tip="Descer"><span data-icon="chevronBaixo" class="sdb-icon--sm"></span></button>
        <button class="sdb-btn sdb-btn--icon sdb-btn--sm" type="button" aria-label="Remover parágrafo 1" data-tip="Remover"><span data-icon="lixeira" class="sdb-icon--sm"></span></button>
      </div>
    </div>
    <button class="sdb-btn sdb-btn--tinted sdb-btn--sm" type="button" style="align-self:flex-start"><span data-icon="mais" class="sdb-icon--sm"></span>Adicionar parágrafo</button>
  </div>
</div>
<script>SalaBuscadores.hydrate();</script>
