<!-- @dsCard group="Estrutura do portal" height=900 subtitle="Entrar, recuperar senha e criar conta com gravuras de domínio público do acervo." -->
<main class="sdb-conta sdb-conta--entrada">
  <div class="sdb-conta__imagem" role="group" aria-roledescription="carrossel" aria-label="Imagens do acervo">
    <img class="is-current" src="../assets/images/conta-entrada.webp" alt="">
    <div class="sdb-conta__imagem-controls">
      <button class="sdb-btn sdb-btn--icon sdb-btn--secondary sdb-btn--sm" type="button" aria-label="Cena anterior"><span data-icon="chevronEsquerda" class="sdb-icon--sm"></span></button>
      <div class="sdb-dots" role="group" aria-label="Escolher cena"><button type="button" aria-label="Cena 1" aria-current="true"></button><button type="button" aria-label="Cena 2"></button><button type="button" aria-label="Cena 3"></button></div>
      <button class="sdb-btn sdb-btn--icon sdb-btn--secondary sdb-btn--sm" type="button" aria-label="Próxima cena"><span data-icon="chevronDireita" class="sdb-icon--sm"></span></button>
      <button class="sdb-btn sdb-btn--icon sdb-btn--secondary sdb-btn--sm" type="button" aria-label="Pausar giro" data-tip="Pausar"><span data-icon="pausar" class="sdb-icon--sm"></span></button>
    </div>
  </div>
  <div class="sdb-conta__conteudo">
    <p class="sdb-conta__marca">A Sala dos Buscadores</p>
    <form class="sdb-conta__form sdb-conta__form--entrar" aria-labelledby="conta-titulo" onsubmit="event.preventDefault();SalaBuscadores.toast('Prévia do formulário de acesso.')">
      <div class="sdb-conta__cabecalho"><h1 class="sdb-conta__titulo" id="conta-titulo">Entrar</h1><p class="sdb-conta__lead">Entre para estudar no acervo. A conta é gratuita e guarda seu progresso só para você.</p></div>
      <div class="sdb-field"><label class="sdb-label" for="conta-email">E-mail</label><div class="sdb-control"><input id="conta-email" type="email" autocomplete="email"></div></div>
      <div class="sdb-field"><label class="sdb-label" for="conta-senha">Senha</label><div class="sdb-control"><input id="conta-senha" type="password" autocomplete="current-password"><button class="sdb-control__btn" type="button" data-toggle-password aria-label="Mostrar senha" aria-pressed="false"><span data-icon="olho"></span></button></div></div>
      <button class="sdb-btn sdb-btn--primary sdb-btn--block" type="submit">Entrar</button>
      <p class="sdb-footnote sdb-conta__alternativa">A conta é gratuita e seu progresso é privado.</p>
    </form>
  </div>
</main>
