name: Deploy na VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, vps-sala]
    steps:
      - run: /usr/local/bin/sala-deploy
      - run: curl -fsS -o /dev/null -w "site respondeu %{http_code}\n" https://asaladosbuscadores.com.br/entrar
