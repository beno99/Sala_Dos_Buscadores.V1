# Persistência local: Postgres (acervo, contas, estudo, comunidade) e MinIO (imagens, compatível com S3).
# Subir: docker compose up -d · Migrar: npm run db:migrate · Popular: npm run db:seed
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sala
      POSTGRES_PASSWORD: sala
      POSTGRES_DB: sala_dos_buscadores
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-e2e.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sala -d sala_dos_buscadores"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sala
      MINIO_ROOT_PASSWORD: sala-minio-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  # Cria o bucket de mídia na primeira subida.
  minio-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 sala sala-minio-local; do sleep 1; done;
      mc mb --ignore-existing local/sala-midia;
      "

volumes:
  postgres:
  minio:
